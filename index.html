<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hacker Troll</title>

  <style>
    body{
      margin:0;
      background:black;
      color:#00ff66;
      font-family:Consolas, monospace;
      overflow:hidden;
    }

    canvas{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:-1;
      opacity:0.15;
    }

    .container{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
    }

    h1{
      font-size:50px;
      text-shadow:0 0 15px #00ff66;
      animation:blink 1s infinite;
    }

    p{
      font-size:18px;
    }

    .terminal{
      margin-top:30px;
      width:85%;
      max-width:700px;
      height:260px;
      background:rgba(0,0,0,0.7);
      border:1px solid #00ff66;
      box-shadow:0 0 20px #00ff66;
      padding:20px;
      text-align:left;
      overflow:hidden;
    }

    .line{
      margin:5px 0;
      animation:fade .4s;
    }

    @keyframes blink{
      50%{
        opacity:.5;
      }
    }

    @keyframes fade{
      from{
        opacity:0;
      }
      to{
        opacity:1;
      }
    }
  </style>
</head>

<body>

<audio id="trollMusic" src="music.mp3" loop></audio>

<canvas id="matrix"></canvas>

<div class="container">
  <h1>⚠ SYSTEM HACKER ⚠</h1>
  <p>Dữ liệu đang được tải lên máy chủ...</p>

  <div class="terminal" id="terminal"></div>
</div>

<script>

const terminal = document.getElementById("terminal");

const fakeLogs = [
  "Kết nối máy chủ...",
  "Bypass firewall...",
  "Đang quét dữ liệu ảnh...",
  "Đang lấy mật khẩu WiFi...",
  "Upload completed 12%",
  "Upload completed 38%",
  "Upload completed 67%",
  "Truy cập camera thành công",
  "Đang mã hóa dữ liệu...",
  "⚠ CẢNH BÁO: Thiết bị đã bị kiểm soát ⚠",
  "JK thôi :)) Bị troll rồi nha"
];

let i = 0;

function showPopup(message){
  if(Notification.permission === "granted"){
    new Notification(message);
  }
}

Notification.requestPermission();

function addLine(){

  if(i < fakeLogs.length){

    const div = document.createElement("div");

    div.className = "line";
    div.textContent = "> " + fakeLogs[i];

    terminal.appendChild(div);

    terminal.scrollTop = terminal.scrollHeight;

    // Tới dòng JK thì phát nhạc
    if(fakeLogs[i].includes("JK thôi")){

      const music = document.getElementById("trollMusic");

      music.volume = 1.0;

      music.play().then(()=>{

        showPopup("😂 Bạn đã bị troll!");

        setTimeout(()=>{
          alert("😂 Bạn đã bị troll bởi Nguyen Tuan Kiet!");
        },1000);

      }).catch(err=>{
        console.log(err);
      });

    }

    i++;

    setTimeout(addLine,1000);
  }

}

addLine();


// MATRIX EFFECT

const canvas = document.getElementById("matrix");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";

const fontSize = 16;

const columns = canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){
  drops[x] = 1;
}

function draw(){

  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#00ff66";
  ctx.font = fontSize + "px monospace";

  for(let i = 0; i < drops.length; i++){

    const text = letters[Math.floor(Math.random() * letters.length)];

    ctx.fillText(text,i * fontSize,drops[i] * fontSize);

    if(drops[i] * fontSize > canvas.height && Math.random() > 0.975){
      drops[i] = 0;
    }

    drops[i]++;
  }
}

setInterval(draw,35);

</script>

</body>
</html>
